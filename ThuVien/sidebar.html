<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar Phụ Huynh - Learnova</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <!-- Khung Sidebar -->
    <aside class="sidebar">
      <!-- Phần Logo / Tên cổng -->
      <div class="sidebar__logo">
        <img src="logo.jpg" alt="Logo Learnova" class="sidebar__logo-img" />
        <h2>Learnova</h2>
        <p>Cổng Phụ Huynh</p>
      </div>

      <!-- Phần Menu Điều hướng -->
      <nav class="sidebar__nav">
        <!-- Nhóm: Học tập của con -->
        <div class="nav-section">
          <h3 class="nav-section__title">Học tập của con</h3>
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#" class="nav-link active">Danh sách bài kiểm tra</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">Báo cáo học tập</a>
            </li>
          </ul>
        </div>

        <!-- Nhóm: Tài khoản -->
        <div class="nav-section">
          <h3 class="nav-section__title">Tài khoản</h3>
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#" class="nav-link">Thông tin cá nhân</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">Bảo mật</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">Cài đặt</a>
            </li>
          </ul>
        </div>
      </nav>
    </aside>

    <!-- Khu vực nội dung chính bên phải sidebar -->
    <main class="main-content">
      <h1>Nội dung trang phụ huynh</h1>
      <p>Chọn các chức năng ở thanh menu bên trái.</p>
    </main>
  </body>
</html>
